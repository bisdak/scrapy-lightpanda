[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrapy-lightpanda"
version = "0.1.0"
description = "Opt-in Lightpanda downloader middleware for Scrapy"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Scrapy>=2.11,<3", "lightpanda-py"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]
