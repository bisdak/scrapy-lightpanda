name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q

  minimum-scrapy:
    name: Tests (minimum Scrapy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install project with minimum Scrapy version
        # Scrapy 2.11 imports private w3lib symbols removed in w3lib 2.5.
        run: python -m pip install -e '.[dev]' 'Scrapy==2.11.0' 'w3lib<2.5'
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build distributions
    needs: [test, minimum-scrapy]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install project and build tools
        run: python -m pip install -e '.[dev]'
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Test source distribution
        shell: bash
        run: |
          SDIST="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          SOURCE_ROOT="/tmp/sdist-source"
          mkdir -p "${SOURCE_ROOT}"
          tar -xzf "${SDIST}" -C "${SOURCE_ROOT}"
          python -m pip uninstall -y scrapy-lightpanda-middleware
          python -m pip install --no-deps "${SDIST}"
          cd "${SOURCE_ROOT}"/scrapy_lightpanda_middleware-*
          python -m pytest -q
