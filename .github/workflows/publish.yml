name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install project and test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build distributions
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check release tag matches project version
        env:
          GITHUB_REF_NAME: ${{ github.event.release.tag_name }}
        run: |
          VERSION="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")"
          EXPECTED_TAG="v${VERSION}"
          if [ "${GITHUB_REF_NAME}" != "${EXPECTED_TAG}" ]; then
            echo "Release tag '${GITHUB_REF_NAME}' does not match expected '${EXPECTED_TAG}'." >&2
            exit 1
          fi
      - name: Install project and build tools
        run: python -m pip install -e '.[dev]'
      - name: Build wheel and source distribution
        run: python -m build
      - name: Validate package metadata
        run: python -m twine check dist/*
      - name: Test source distribution
        shell: bash
        run: |
          SDIST="$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)"
          SOURCE_ROOT="/tmp/sdist-source"
          mkdir -p "${SOURCE_ROOT}"
          tar -xzf "${SDIST}" -C "${SOURCE_ROOT}"
          python -m pip uninstall -y scrapy-lightpanda-middleware
          python -m pip install --no-deps "${SDIST}"
          cd "${SOURCE_ROOT}"/scrapy_lightpanda_middleware-*
          python -m pytest -q
      - name: Store distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish package
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/scrapy-lightpanda-middleware
    permissions:
      id-token: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
